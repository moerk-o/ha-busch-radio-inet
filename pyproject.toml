[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported
# (setting recommended by the pytest-homeassistant package).
addopts = "-p no:respx"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "real_setup_probe: run with the real setup probe instead of the stub",
]

# The tests load the integration from tests/custom_components/, so coverage
# must measure that copy (kept in sync via sync_and_test.sh).
# See TESTING_GUIDE.md section 3.7.1.
[tool.coverage.run]
source = ["tests/custom_components/busch_radio_inet"]

[tool.coverage.report]
show_missing = true
