[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "real_setup_probe: run with the real setup probe instead of the stub",
]

# The pytest-homeassistant-custom-component plugin loads the integration from
# tests/custom_components/, so coverage must measure that copy (kept in sync via
# sync_and_test.sh). See TESTING_GUIDE.md section 3.7.1.
[tool.coverage.run]
source = ["tests/custom_components/busch_radio_inet"]

[tool.coverage.report]
show_missing = true
