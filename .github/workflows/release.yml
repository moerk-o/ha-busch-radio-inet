name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Sync integration into tests/ and run tests
        run: ./sync_and_test.sh --cov=tests/custom_components/busch_radio_inet

  release:
    name: Release Busch-Radio iNet
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Create zip package
        run: |
          cd "${{ github.workspace }}/custom_components/busch_radio_inet"
          zip busch_radio_inet.zip -r ./

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/custom_components/busch_radio_inet/busch_radio_inet.zip
